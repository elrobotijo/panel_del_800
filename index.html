

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Interactivo: El Panel del 701 al 800</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --front-bg: #fdf2f8;
            --front-text: #0f172a;
            --back-bg: #e11d48; /* Tema rosa/rojo para diferenciar la centena de los 700s */
            --back-text: #ffffff;
            --active-border: #be123c;
            --range-highlight-bg: #ffe4e6;
            --range-highlight-text: #881337;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            max-width: 650px;
            margin: 0 auto;
            background: #cbd5e1;
            padding: 12px;
            border-radius: 20px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.15);
        }

        .number-card {
            aspect-ratio: 1/1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.05rem; 
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 3px 5px rgba(0,0,0,0.08);
            background-color: var(--front-bg);
            color: var(--front-text);
            border: 2px solid rgba(0,0,0,0.08);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .number-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.12);
        }

        .number-card.is-dimmed {
            opacity: 0.3;
            filter: grayscale(70%);
            background-color: #e2e8f0;
            pointer-events: none;
        }

        .number-card.in-focus-range {
            border: 2px solid #f43f5e; /* Rosa brillante */
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
        }

        .number-card.is-active {
            background-color: #16a34a !important;
            color: #ffffff !important;
            transform: scale(0.96);
            border-color: #15803d !important;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.3);
        }

        .btn-active {
            outline: 3px solid #e11d48 !important; /* Rosa/Rojo */
            outline-offset: 2px;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3) !important;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.18); }
        }
        .success-jump {
            animation: bounce 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .error-shake {
            animation: shake 0.4s ease;
            background-color: #fecdd3 !important;
            border-color: #e11d48 !important;
        }

        #audio-unlock-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-200 min-h-screen p-3 md:p-6 font-sans antialiased text-slate-800">

        <div class="bg-white p-8 md:p-10 rounded-3xl text-center shadow-2xl max-w-sm border-4 border-rose-500 mx-4">

        <!-- Tema rose/rojo para diferenciar del panel del 601-700 -->

                <svg id="icon-expand" class="w-5 h-5 md:w-6 md:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                <svg id="icon-compress" class="w-5 h-5 md:w-6 md:h-6 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h6m0 0v6m0-6l-7 7m17-11h-6m0 0V4m0 6l7-7M4 10h6m0 0V4m0 6l-7-7m17 11h-6m0 0v6m0-6l7 7"></path></svg>
            </button>

                    <h3 class="font-black text-slate-400 uppercase text-xs tracking-wider mb-3">Selecciona una Actividad</h3>
                    
                    <div class="overflow-y-auto pr-1 space-y-4 custom-scrollbar flex-1">
                        
                        <!-- Actividades Generales -->

                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">General</span>

                                <button id="btn-range-761-780" onclick="setMode('range', {min: 761, max: 780})" class="mode-btn py-2.5 px-4 bg-fuchsia-600 text-white font-bold rounded-xl hover:bg-fuchsia-700 transition text-left text-sm border-b-2 border-fuchsia-800 flex items-center justify-between">

                                <button id="btn-range-781-800" onclick="setMode('range', {min: 781, max: 800})" class="mode-btn py-2.5 px-4 bg-amber-600 text-white font-bold rounded-xl hover:bg-amber-700 transition text-left text-sm border-b-2 border-amber-800 flex items-center justify-between">
                                    <span>🎯 Del 781 al 800</span>

                                </button>

                        <div>
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Patrones</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="btn-pattern-2" onclick="setMode('pattern', 2)" class="mode-btn py-2.5 px-3 bg-pink-600 text-white font-bold rounded-xl hover:bg-pink-700 transition text-center text-xs border-b-2 border-pink-800">

                    </div>

                    <!-- Botón limpiar -->
                    <button onclick="resetAll()" class="mt-4 py-2.5 w-full bg-slate-100 hover:bg-red-50 text-red-600 font-extrabold uppercase text-xs tracking-wider rounded-xl transition border border-slate-200 flex items-center justify-center gap-1">
                        <span>🔄</span> Limpiar Panel
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const grid = document.getElementById('panel-grid');
        const statusEl = document.getElementById('game-status');
        const instructionEl = document.getElementById('instruction-text');
        const progressBadge = document.getElementById('progress-badge');
        const progressCountEl = document.getElementById('progress-count');
        const progressTotalEl = document.getElementById('progress-total');

        let currentGame = 'free'; 
        let targetNum = null;
        let patternStep = 2;
        let activeRange = { min: 701, max: 800 };
        let foundInCurrentRange = new Set();
        let audioActive = false;
        let webAudioCtx = null;
        let gameLog = [];

        function initWebAudio() {
            if (!webAudioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                webAudioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!audioActive || !webAudioCtx) return;
            const now = webAudioCtx.currentTime;

            if (type === 'success') {
                const osc = webAudioCtx.createOscillator();
                const gain = webAudioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15); 
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(webAudioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'error') {
                const osc = webAudioCtx.createOscillator();
                const gain = webAudioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(webAudioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'complete') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, idx) => {
                    const osc = webAudioCtx.createOscillator();
                    const gain = webAudioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(webAudioCtx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        function logAction(type, expected, actual, success, subType = "standard") {
            gameLog.push({ timestamp: new Date().toISOString(), gameMode: currentGame, expectedValue: expected, actualValue: actual, isCorrect: success, subType: subType });
        }

        async function unlockAudio() {
            audioActive = true;
            initWebAudio();
            document.getElementById('audio-unlock-overlay').style.display = 'none';
            createBoard();
            await speak("¡Panel activado! Del setecientos uno al ochocientos.");
        }

        async function speak(text) {
            if (!audioActive) return;
            const success = await speakWithGemini(text);
            if (!success) {
                await speakLocally(text);
            }
        }

        async function speakWithGemini(text) {
            if (!apiKey) return false;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Di de forma clara, amigable y pausada: ${text}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                        }
                    })
                });
                const data = await response.json();
                const base64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (!base64) return false;
                
                return new Promise((resolve) => {
                    const audio = new Audio(URL.createObjectURL(pcmToWav(base64, 24000)));
                    audio.onended = () => resolve(true);
                    audio.onerror = () => resolve(false);
                    audio.play();
                });
            } catch { return false; }
        }

        function speakLocally(text) {
            return new Promise((resolve) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'es-ES'; 
                    u.rate = 0.85;
                    
                    let resolved = false;
                    const onComplete = () => {
                        if (!resolved) {
                            resolved = true;
                            resolve(true);
                        }
                    };
                    
                    u.onend = onComplete;
                    u.onerror = onComplete;
                    window.speechSynthesis.speak(u);
                    
                    setTimeout(onComplete, (text.length * 100) + 1000); 
                } else {
                    resolve(false);
                }
            });
        }

        function pcmToWav(b64, rate) {
            const chars = atob(b64);
            const buf = new ArrayBuffer(chars.length);
            const view = new Uint8Array(buf);
            for (let i = 0; i < chars.length; i++) view[i] = chars.charCodeAt(i);
            const wav = new ArrayBuffer(44 + buf.byteLength);
            const dv = new DataView(wav);
            dv.setUint32(0, 0x52494646, false); dv.setUint32(4, 36 + buf.byteLength, true);
            dv.setUint32(8, 0x57415645, false); dv.setUint32(12, 0x666d7420, false);
            dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); 
            dv.setUint32(16, 16, true); dv.setUint32(24, rate, true);
            dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true);
            dv.setUint16(34, 16, true); dv.setUint32(36, 0x64617461, false);
            dv.setUint32(40, buf.byteLength, true);
            new Uint8Array(wav, 44).set(view);
            return new Blob([wav], { type: 'audio/wav' });
        }

        function createBoard() {
            grid.innerHTML = '';
            // Se genera el panel desde 701 hasta 800
            for (let i = 701; i <= 800; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.id = `card-${i}`;
                card.innerText = i;
                card.onclick = () => onCardClick(i);
                grid.appendChild(card);
            }
            updateBoardFocusStyles();
        }

        function updateBoardFocusStyles() {
            for (let i = 701; i <= 800; i++) {
                const card = document.getElementById(`card-${i}`);
                if (!card) continue;

                if (currentGame === 'range') {
                    if (i >= activeRange.min && i <= activeRange.max) {
                        card.classList.remove('is-dimmed');
                        card.classList.add('in-focus-range');
                    } else {
                        card.classList.add('is-dimmed');
                        card.classList.remove('in-focus-range');
                    }
                } else {
                    card.classList.remove('is-dimmed', 'in-focus-range');
                }
            }
        }

        function repeatInstruction() {
            if (targetNum !== null && (currentGame === 'find' || currentGame === 'range')) {
                speak(`Busca el número ${targetNum}`);
            } else if (targetNum !== null && currentGame === 'pattern') {
                speak(`¿Cuál es el siguiente múltiplo?`);
            }
        }

        async function onCardClick(num) {
            const card = document.getElementById(`card-${num}`);
            if (!card) return;

            if (currentGame === 'free') {
                card.classList.toggle('is-active');
                playSound('success');
                speak(num.toString());
                return;
            }

            if (card.classList.contains('is-active')) return;

            if (currentGame === 'range') {
                if (num < activeRange.min || num > activeRange.max) {
                    playSound('error');
                    card.classList.add('error-shake');
                    speak(`El ${num} no está en este tramo.`);
                    setTimeout(() => card.classList.remove('error-shake'), 500);
                    return;
                }

                if (num === targetNum) {
                    playSound('success');
                    card.classList.add('is-active', 'success-jump');
                    foundInCurrentRange.add(num);
                    logAction("ACIERTO_TRAMO", targetNum, num, true);

                    const totalInRange = (activeRange.max - activeRange.min) + 1;
                    progressCountEl.innerText = foundInCurrentRange.size;

                    await speak(`¡Excelente!`);

                    setTimeout(() => {
                        card.classList.remove('success-jump');
                        if (foundInCurrentRange.size >= totalInRange) {
                            playSound('complete');
                            document.getElementById('instruction-label').innerText = "¡Reto Superado!";
                            instructionEl.innerHTML = `<span class="text-4xl font-black text-emerald-600">¡Fabuloso!</span>`;
                            speak(`¡Fabuloso! Has completado todos los números de este tramo.`);
                        } else {
                            nextStep();
                        }
                    }, 500);
                } else {
                    playSound('error');
                    card.classList.add('error-shake');
                    logAction("ERROR_TRAMO", targetNum, num, false);
                    speak(`No, ese es el ${num}. Busca el número ${targetNum}.`);
                    setTimeout(() => card.classList.remove('error-shake'), 500);
                }
                return;
            }

            if (num === targetNum) {
                playSound('success');
                card.classList.add('is-active', 'success-jump');
                logAction("ACIERTO", targetNum, num, true);
                
                await speak("¡Eso es!");
                
                setTimeout(() => {
                    card.classList.remove('success-jump');
                    nextStep();
                }, 500);
            } else {
                playSound('error');
                card.classList.add('error-shake');
                
                if (currentGame === 'pattern' && num % patternStep === 0 && num > targetNum) {
                    logAction("ERROR", targetNum, num, false, "salto_orden");
                    speak(`El ${num} es múltiplo, pero te has saltado alguno anterior.`);
                } else {
                    logAction("ERROR", targetNum, num, false, "incorrecto");
                    speak(`No, ese es el ${num}. Busca el número ${targetNum}.`);
                }
                
                setTimeout(() => card.classList.remove('error-shake'), 500);
            }
        }

        async function setMode(mode, params = null) {
            currentGame = mode;
            resetCardsState();
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('btn-active'));
            progressBadge.classList.add('hidden');

            if (mode === 'free') {
                document.getElementById('btn-free').classList.add('btn-active');
                statusEl.innerText = "Modo Libre";
                document.getElementById('instruction-label').innerText = "Instrucción";
                instructionEl.innerHTML = `<span class="text-amber-950 font-black text-lg md:text-xl text-center">Toca cualquier número para escucharlo.</span>`;
                activeRange = { min: 701, max: 800 };
                updateBoardFocusStyles();
                speak("Modo libre activado.");
            } 
            else if (mode === 'find') {
                document.getElementById('btn-find').classList.add('btn-active');
                statusEl.innerText = "Buscar 701-800";
                activeRange = { min: 701, max: 800 };
                updateBoardFocusStyles();
                await speak("Vamos a buscar números en todo el panel.");
                nextStep(); 
            } 
            else if (mode === 'range' && params) {
                activeRange = params;
                foundInCurrentRange.clear();
                const btnId = `btn-range-${params.min}-${params.max}`;
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add('btn-active');

                statusEl.innerText = `Tramo: ${params.min} a ${params.max}`;
                const totalTarget = (params.max - params.min) + 1;
                progressCountEl.innerText = '0';
                progressTotalEl.innerText = totalTarget.toString();
                progressBadge.classList.remove('hidden');

                updateBoardFocusStyles();
                await speak(`Actividad. Números del ${params.min} al ${params.max}. ¡Empecemos!`);
                nextStep(); 
            }
            else if (mode === 'pattern') {
                patternStep = params;
                activeRange = { min: 701, max: 800 };
                updateBoardFocusStyles();
                const btnId = `btn-pattern-${params}`;
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add('btn-active');

                statusEl.innerText = "Serie del " + params;
                targetNum = 700; // Base inicial para múltiplos en este panel
                await speak(`Vamos a buscar la serie del ${params}.`);
                nextStep();
            }
        }

        function renderGiantNumberHTML(num) {
            return `
            <div onclick="repeatInstruction()" class="cursor-pointer group flex flex-col items-center justify-center bg-white/60 w-full h-full rounded-2xl p-2 hover:bg-white transition shadow-sm border-2 border-transparent hover:border-rose-400">
                <span class="text-[5rem] md:text-[6rem] font-black leading-none text-rose-700 drop-shadow-xl animate-pulse group-hover:scale-105 transition-transform select-none">${num}</span>
                <div class="mt-3 text-amber-700 font-bold text-xs uppercase tracking-widest flex items-center gap-1.5 opacity-60 group-hover:opacity-100 bg-amber-200/50 px-3 py-1 rounded-full">
                    <span class="text-base">🔊</span> Tocar para escuchar
                </div>
            </div>
            `;
        }

        function nextStep() {
            if (currentGame === 'find') {
                // Genera números aleatorios entre 701 y 800
                targetNum = Math.floor(Math.random() * 100) + 701;
                if (document.getElementById(`card-${targetNum}`).classList.contains('is-active')) {
                    nextStep(); return;
                }
                document.getElementById('instruction-label').innerText = "Busca el número:";
                instructionEl.innerHTML = renderGiantNumberHTML(targetNum);
                speak(`Busca el número ${targetNum}`);
            } 
            else if (currentGame === 'range') {
                const available = [];
                for (let i = activeRange.min; i <= activeRange.max; i++) {
                    if (!foundInCurrentRange.has(i)) {
                        available.push(i);
                    }
                }

                if (available.length === 0) {
                    document.getElementById('instruction-label').innerText = "¡Reto Superado!";
                    instructionEl.innerHTML = `<span class="text-3xl font-black text-emerald-600">¡Muy bien!</span>`;
                    speak("¡Has completado todos los números de este tramo!");
                    return;
                }

                const randomIndex = Math.floor(Math.random() * available.length);
                targetNum = available[randomIndex];

                document.getElementById('instruction-label').innerText = "Busca el número:";
                instructionEl.innerHTML = renderGiantNumberHTML(targetNum);
                speak(`Busca el número ${targetNum}`);
            }
            else if (currentGame === 'pattern') {
                const prevNum = targetNum;
                targetNum += patternStep;
                
                if (targetNum > 800) {
                    playSound('complete');
                    document.getElementById('instruction-label').innerText = "¡Completado!";
                    instructionEl.innerHTML = `<span class="text-3xl font-black text-rose-600">¡Fantástico!</span>`;
                    speak("¡Genial! Has completado toda la serie.");
                    setTimeout(() => setMode('free'), 3000);
                    return;
                }

                if (prevNum === 700) { // Primer paso basado en la nueva tabla (700+step)
                    document.getElementById('instruction-label').innerText = "Busca el primero:";
                    instructionEl.innerHTML = renderGiantNumberHTML(targetNum);
                    speak(`Para empezar, busca el número ${targetNum}`);
                } else {
                    document.getElementById('instruction-label').innerText = "¿Siguiente número?";
                    instructionEl.innerHTML = `<span class="text-2xl md:text-3xl font-black text-rose-600 text-center leading-tight">Múltiplo de ${patternStep}</span>`;
                    speak("¿Cuál es el siguiente?");
                }
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error al intentar activar pantalla completa: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const iconExpand = document.getElementById('icon-expand');
            const iconCompress = document.getElementById('icon-compress');
            
            if (document.fullscreenElement) {
                iconExpand.classList.add('hidden');
                iconCompress.classList.remove('hidden');
            } else {
                iconExpand.classList.remove('hidden');
                iconCompress.classList.add('hidden');
            }
        });

        function resetCardsState() {
            for (let i = 701; i <= 800; i++) {
                const card = document.getElementById(`card-${i}`);
                if (card) {
                    card.classList.remove('is-active', 'success-jump', 'error-shake', 'is-dimmed', 'in-focus-range');
                }
            }
        }

        function resetAll() {
            resetCardsState();
            foundInCurrentRange.clear();
            setMode('free');
        }
    </script>
</body>
</html>
